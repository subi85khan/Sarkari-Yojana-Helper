<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarkari Yojana Helper</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>🇮🇳 Sarkari Yojana Helper</h1>

    <p class="subtitle">
      Sarkari yojanaon ki jankari ek hi jagah
    </p>

    <input
      type="text"
      id="search"
      placeholder="🔎 Yojana search karein..."
    >

    <div id="yojanaList">

      <div class="card">
        <h2>🌾 PM Kisan</h2>
        <p>Kisanon se judi sarkari yojana ki jankari.</p>
        <button>View Details</button>
      </div>

      <div class="card">
        <h2>🏠 PM Awas Yojana</h2>
        <p>Awas se judi sarkari yojana ki jankari.</p>
        <button>View Details</button>
      </div>

      <div class="card">
        <h2>👩 Mahila Yojana</h2>
        <p>Mahilaon ke liye sarkari yojanaon ki jankari.</p>
        <button>View Details</button>
      </div>

    </div>

  </div>

  <script src="app.js"></script>

</body>
</html>
